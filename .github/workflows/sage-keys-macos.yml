name: Sage Keys for Mac
on:
  workflow_dispatch:
    inputs:
      previous_run:
        description: "Optional run with the published 0.2.2 ZIP to reproduce the installed-app update lifecycle"
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '!macos/**/*.md'
      - '!macos/evidence/**'
      - 'docs/AUDIO.md'
      - 'src/**'
      - 'assets/**'
      - 'style.css'
      - '.github/workflows/sage-keys-macos.yml'
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record toolchain and build offline bundle
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swiftc --version
          test "$(uname -m)" = arm64
          npm ci --prefix macos
          bash macos/build.sh
      - name: Verify and package personal test app
        run: |
          codesign --verify --deep --strict --verbose=2 'macos/build/Sage Keys.app'
          ditto -c -k --sequesterRsrc --keepParent 'macos/build/Sage Keys.app' 'macos/build/Sage-Keys-arm64.zip'
          cd macos/build && shasum -a 256 Sage-Keys-arm64.zip > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sage-Keys-arm64-personal-test
          path: |
            macos/build/Sage-Keys-arm64.zip
            macos/build/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Create Finder disk image
        run: bash macos/Packaging/dmg.sh
      - name: Test Finder installation and installed application
        run: bash macos/Tests/dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sage-Keys-Apple-Silicon-DMG
          path: |
            macos/build/Sage-Keys-Apple-Silicon.dmg
            macos/build/DMG-SHA256.txt
          retention-days: 30
          if-no-files-found: error
      - name: Run native state and WKWebView checks
        run: bash macos/Tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sage-Keys-mac-test-evidence
          path: macos/build/evidence/
          if-no-files-found: warn
          retention-days: 30
  compare-update:
    if: github.event_name == 'workflow_dispatch' && inputs.previous_run != ''
    needs: apple-silicon
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Sage-Keys-arm64-personal-test
          path: old-release
          run-id: ${{ inputs.previous_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Sage-Keys-arm64-personal-test
          path: new-release
      - name: Exercise downloaded releases in Applications and compare their signing requirements
        run: bash macos/Tests/update-identity.sh old-release/Sage-Keys-arm64.zip new-release/Sage-Keys-arm64.zip
  settings-links:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe the actual System Settings destination
        run: |
          xcrun swiftc macos/Sources/SettingsLinks.swift macos/Tests/SettingsProbe/main.swift -o "$RUNNER_TEMP/settings-probe"
          "$RUNNER_TEMP/settings-probe"
